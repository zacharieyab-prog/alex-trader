name: Alex Trader Research Lab

on:
  workflow_dispatch:
    inputs:
      run_forex_gold:
        description: "Attempt Twelve Data forex and gold downloads (requires TWELVEDATA_API_KEY repository secret)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Alex Trader
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run agent safety tests
        run: npm test

      - name: Download historical market data
        id: download
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ inputs.run_forex_gold && secrets.TWELVEDATA_API_KEY || '' }}
        run: node scripts/download-research.js

      - name: Run historical backtests
        id: backtest
        if: always()
        continue-on-error: true
        run: node scripts/backtest.js

      - name: Upload research data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alex-trader-research-${{ github.run_number }}
          path: |
            data/historical/
            data/reports/
            data/historical/download-manifest.json
            research-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Report run status
        if: always()
        run: |
          echo "Historical/demo research only."
          echo "Live trading and order placement must remain disabled."
          echo "Download step outcome: ${{ steps.download.outcome }}"
          echo "Backtest step outcome: ${{ steps.backtest.outcome }}"
