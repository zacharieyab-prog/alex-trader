services:
  - type: web
    name: alex-trader
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TRADER_FEED_TOKEN
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
